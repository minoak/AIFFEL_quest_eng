<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .box { rx: 10; stroke-width: 1.5; }
    .t  { font-size: 13px; fill: #222; }
    .tb { font-size: 13.5px; font-weight: bold; fill: #111; }
    .ts { font-size: 11.5px; fill: #555; }
    .ln { stroke: #555; stroke-width: 1.4; marker-end: url(#arr); fill: none; }
  </style>

  <text x="590" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">v5 위험도 평가 시스템 처리 흐름</text>

  <!-- 입력 -->
  <rect class="box" x="20" y="165" width="130" height="70" fill="#FFF3E0" stroke="#E65100"/>
  <text class="tb" x="85" y="194" text-anchor="middle">블랙박스 이미지</text>
  <text class="ts" x="85" y="214" text-anchor="middle">야간 주행 한 장면</text>

  <!-- Seg -->
  <rect class="box" x="185" y="155" width="180" height="90" fill="#E8F5E9" stroke="#2E7D32"/>
  <text class="tb" x="275" y="182" text-anchor="middle">픽셀 분류 (Segmentation)</text>
  <text class="ts" x="275" y="202" text-anchor="middle">U-Net R34 5개 모델 다수결</text>
  <text class="ts" x="275" y="220" text-anchor="middle">mIoU(fg) 0.7845 ± 0.0100</text>

  <!-- 3 feature boxes -->
  <rect class="box" x="405" y="45" width="185" height="64" fill="#E3F2FD" stroke="#1565C0"/>
  <text class="tb" x="497" y="71" text-anchor="middle">차선 검출 + 소실점(VP)</text>
  <text class="ts" x="497" y="91" text-anchor="middle">도로 구조·진행 방향 파악</text>

  <rect class="box" x="405" y="168" width="185" height="64" fill="#FCE4EC" stroke="#AD1457"/>
  <text class="tb" x="497" y="194" text-anchor="middle">내 오토바이 분리 (Ego)</text>
  <text class="ts" x="497" y="214" text-anchor="middle">자기 차체를 위협으로 오인 방지</text>

  <rect class="box" x="405" y="291" width="185" height="64" fill="#E3F2FD" stroke="#1565C0"/>
  <text class="tb" x="497" y="317" text-anchor="middle">거리 지도 (Depth)</text>
  <text class="ts" x="497" y="337" text-anchor="middle">Apple Depth Pro (미터 단위)</text>

  <!-- distance / zone -->
  <rect class="box" x="640" y="108" width="180" height="76" fill="#E3F2FD" stroke="#1565C0"/>
  <text class="tb" x="730" y="134" text-anchor="middle">거리 추정 (3방식 융합)</text>
  <text class="ts" x="730" y="154" text-anchor="middle">도로 기하 · 객체 크기 · depth</text>
  <text class="ts" x="730" y="172" text-anchor="middle">이상치 제거 + 가중 평균</text>

  <rect class="box" x="640" y="238" width="180" height="76" fill="#FCE4EC" stroke="#AD1457"/>
  <text class="tb" x="730" y="264" text-anchor="middle">4-Zone 구역 판정</text>
  <text class="ts" x="730" y="284" text-anchor="middle">내 진행 경로를 원근 맞춘</text>
  <text class="ts" x="730" y="302" text-anchor="middle">4겹 구역으로 나눠 위치 판정</text>

  <!-- warnings -->
  <rect class="box" x="870" y="120" width="160" height="160" fill="#FFF8E1" stroke="#F57F17"/>
  <text class="tb" x="950" y="146" text-anchor="middle">4개 독립 경고</text>
  <text class="t" x="950" y="172" text-anchor="middle">FCW · 전방 충돌</text>
  <text class="t" x="950" y="196" text-anchor="middle">LDW · 차선 이탈</text>
  <text class="t" x="950" y="220" text-anchor="middle">BSW · 측면 접근</text>
  <text class="t" x="950" y="244" text-anchor="middle">HEAD · 역주행</text>
  <text class="ts" x="950" y="268" text-anchor="middle">각각 Level 0~3 판정</text>

  <!-- final -->
  <rect class="box" x="1065" y="150" width="100" height="100" fill="#E8F5E9" stroke="#2E7D32"/>
  <text class="tb" x="1115" y="180" text-anchor="middle">최종 등급</text>
  <text class="ts" x="1115" y="200" text-anchor="middle">= 최악의 경고</text>
  <text class="ts" x="1115" y="221" text-anchor="middle">안전 · 주의</text>
  <text class="ts" x="1115" y="239" text-anchor="middle">위험 · 치명</text>

  <!-- arrows -->
  <path class="ln" d="M 150 200 L 183 200"/>
  <path class="ln" d="M 365 172 L 403 92"/>
  <path class="ln" d="M 365 200 L 403 200"/>
  <path class="ln" d="M 365 228 L 403 308"/>
  <path class="ln" d="M 590 77 L 638 132"/>
  <path class="ln" d="M 590 77 C 630 77 630 250 638 258"/>
  <path class="ln" d="M 590 200 L 638 160"/>
  <path class="ln" d="M 590 323 L 638 168"/>
  <path class="ln" d="M 820 146 L 868 170"/>
  <path class="ln" d="M 820 276 L 868 240"/>
  <path class="ln" d="M 1030 200 L 1063 200"/>

  <text x="590" y="398" text-anchor="middle" font-size="12.5" fill="#2E7D32" font-weight="bold">모델 재학습 없이 판정 로직만으로 구성한 후처리 5-layer: Ensemble → Ego → Distance → Zone → 4 Warnings</text>
</svg>
